    <style>
    /* CSS styles */
    body {
        margin: 0;
        font-family: 'Lato', sans-serif;
        background-color: #333;
        color: #fff;
        overflow-x: hidden; /* Prevent horizontal scrolling */
        display: flex;
        flex-direction: column;
        min-height: 100vh; /* Ensure full height of viewport */
    }
    h1 {
        font-weight: 300;
        letter-spacing: 2px;
        font-size: 48px;
        margin: 0;
        padding: 20px 0;
    }
    p {
        letter-spacing: 1px;
        font-size: 14px;
        color: #ccc;
    }
    .header {
        position: relative;
        text-align: center;
        background: linear-gradient(60deg, rgba(84, 58, 183, 1) 0%, rgba(0, 172, 193, 1) 100%);
        color: white;
        padding: 20px;
        margin-bottom: 20px; /* Add margin to create space for days container */
        height: 5vh;
	overflow: hidden;
    }
    .logo {
        width: 50px;
        fill: white;
        padding-right: 15px;
        display: inline-block;
        vertical-align: middle;
    }
    .inner-header {
        height: 65vh;
        width: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .content {
        flex: 1; /* Take remaining vertical space */
        position: relative;
        min-height: 300px;
        background-color: #666; /* Cooler background color */
        padding: 20px;
    }
    /* Navigation Bar Styles */
    .navbar {
        background-color: #222;
        overflow: hidden;
        width: 100%;
        display: flex;
        justify-content: center;
        position: sticky;
        top: 0;
        z-index: 1000; /* Ensure navigation bar stays on top */
    }
    .navbar a {
        color: #ccc;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
        font-size: 17px;
        transition: color 0.3s ease;
    }
    .navbar a:hover {
        color: #8db600; /* Olive color */
    }
        

    /* Updated CSS for .days-container */
    .days-container {
        display: flex;
        justify-content: space-around;
        padding: 20px;
        flex-wrap: wrap; /* Allow columns to wrap to the next line */
        gap: 20px; /* Adjust the gap between columns */
        max-width: 90%; /* Adjust as needed */
        margin: auto; /* Center horizontally */
    }

    /* Adjust .day-column width as needed */
    .day-column {
        flex: 1 1 calc(15% - 20px); /* Adjust width calculation */
        text-align: center;
        padding: 20px;
        background-color: #444; /* Darker background color */
        border-radius: 8px;
        max-width: 200px; /* Limit maximum width of each column */
    }
    .day-column h2 {
        font-size: 24px;
        margin-bottom: 5px;
    }
    .day-column h3 {
        font-size: 18px;
        margin-bottom: 10px;
        color: #ccc;
    }
    .day-column p {
        font-size: 18px;
        font-weight: bold;
    }

    /* Footer styles */
    footer {
        background-color: #222;
        color: #ccc;
        text-align: center;
        padding: 10px;
        position: sticky;
        bottom: 0;
        width: 100%;
    }

    /* Tab styles */
    .pool-tabs {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .tab {
        padding: 10px 15px;
        border: 1px solid #ccc;
        background: #444;
        color: #ccc;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s ease;
        font-size: 16px;
    }
    .tab:hover {
        background: #555;
    }
    .tab.active {
        background: #8db600;
        color: white;
        border-color: #8db600;
    }

    /* Mobile responsiveness for tabs */
    @media (max-width: 768px) {
        .pool-tabs {
            flex-direction: column;
            align-items: center;
        }
        .tab {
            width: 80%;
            max-width: 300px;
        }
    }
    </style> 
    <script>
    async function loadPoolData(poolName) {
        const filename = `data/forecasts/forecasted_pool_temps_${poolName}.txt`;
        const todayString = new Date().toLocaleDateString('en-CA');
        let displayName = poolName.replace(/_/g, ' ');
        // Special handling for display names
        const displayMap = {
            'Waco': 'Waco, Texas',
            'Palm_Springs': 'Palm Springs, California',
            'Lemoore': 'Lemoore, California',
            'Atlantic_Park_Virginia_Beach': 'Atlantic Park, Virginia Beach',
            'Oceanside': 'Oceanside, California'
        };
        displayName = displayMap[poolName] || displayName;
        document.getElementById('poolTitle').textContent = `Predicted Water Temperature for ${displayName}`;

        for (let i = 1; i <= 6; i++) {
            const column = document.getElementById(`day${i}`);
            if (column) {
                column.innerHTML = '<p>Loading...</p>';
            }
        }

        try {
            const response = await fetch(filename, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Failed to load data from ${filename}`);
            }

            const text = await response.text();
            const rows = text
                .trim()
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => line.split(','))
                .filter(parts => parts.length >= 2)
                .map(parts => ({ date: parts[0], temp: parts[1] }))
                .filter(row => row.date >= todayString)
                .sort((left, right) => left.date.localeCompare(right.date));

            rows.slice(0, 6).forEach((row, index) => {
                const column = document.getElementById(`day${index + 1}`);
                if (!column) {
                    return;
                }

                const dateObj = new Date(row.date + 'T00:00:00');
                const dayLabel = dateObj.toLocaleDateString('en-US', { weekday: 'long' });

                let suitRecommendation = '';
                const temperature = parseFloat(row.temp);

                if (isNaN(temperature)) {
                    suitRecommendation = 'Invalid temperature data';
                } else if (temperature >= 75) {
                    suitRecommendation = 'Boardshorts';
                } else if (temperature >= 69 && temperature <= 74.99) {
                    suitRecommendation = 'Top / Shorty';
                } else if (temperature >= 63 && temperature <= 68.99) {
                    suitRecommendation = '2 mm Springsuit / 3/2 mm Full Suit';
                } else if (temperature >= 58 && temperature <= 62.99) {
                    suitRecommendation = '4/3 Full Suit';
                } else if (temperature >= 52 && temperature <= 57.99) {
                    suitRecommendation = '4/3 Full Suit + Booties';
                } else if (temperature < 51.99) {
                    suitRecommendation = '5/4 Full Suit + Hood + Booties';
                } else {
                    suitRecommendation = 'Temperature out of range';
                }

                column.innerHTML = `
                    <h2>${dayLabel}</h2>
                    <h3>${row.date}</h3>
                    <p>${row.temp} °F</p>
                    <p>Recommended Suit: ${suitRecommendation}</p>
                `;
            });
        } catch (error) {
            for (let i = 1; i <= 6; i++) {
                const column = document.getElementById(`day${i}`);
                if (column) {
                    column.innerHTML = '<p>Unable to load forecast data.</p>';
                }
            }
            console.error(error);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const tabs = document.querySelectorAll('.tab');
        
        // Load default (Waco)
        loadPoolData('Waco');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // Remove active class from all tabs
                tabs.forEach(t => t.classList.remove('active'));
                // Add active class to clicked tab
                this.classList.add('active');
                // Load data for selected pool
                loadPoolData(this.dataset.pool);
            });
        });
    });
    </script>
</head>
